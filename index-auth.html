<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLA CAREER｜Auth正式版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#32c904;--blue:#2563eb;--bg:#fffdf7;--ink:#111827;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.05)}.nav{max-width:1120px;margin:auto;padding:12px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.logo{font-size:22px;font-weight:900;margin-right:auto}.logo span{color:var(--green)}button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:10px 15px;font-weight:800;cursor:pointer}button.secondary{background:#e0f2fe;color:#0369a1}button.gray{background:#f1f5f9;color:#334155}button.blue{background:var(--blue)}main{max-width:1120px;margin:24px auto 80px;padding:0 14px}.section{display:none}.section.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 26px rgba(17,24,39,.07)}.hero{background:linear-gradient(105deg,#fff 0%,#fff 45%,#ecffe4 46%,#eef7ff 100%);border-radius:0;padding:54px 28px;margin:-24px -14px 24px}.hero-inner{max-width:1120px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.hero h1{font-size:48px;margin:0 0 8px}.lead{font-size:20px;font-weight:900}.hero-panel{background:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 55px rgba(0,0,0,.12)}.big-entry{display:grid;grid-template-columns:1fr 1fr;gap:22px}.entry{border-radius:24px;color:#fff;padding:30px;min-height:210px;cursor:pointer;box-shadow:0 18px 45px rgba(0,0,0,.15)}.entry.dispatch{background:linear-gradient(135deg,#34d399,#0ea5e9)}.entry.career{background:linear-gradient(135deg,#2563eb,#7c3aed)}.entry h2{font-size:32px;margin:0 0 10px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;margin:6px 0 14px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.alert{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#f1f5f9;color:#334155}.job{border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;background:#fff}.badge{display:inline-block;border-radius:999px;background:#e0f2fe;color:#0369a1;padding:4px 10px;font-size:12px;font-weight:800;margin-right:4px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;font-size:14px}th{background:#f8fafc}footer{background:var(--green);color:#fff;text-align:center;padding:34px 14px;margin-top:50px}@media(max-width:760px){.hero-inner,.big-entry,.row{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">SOLA <span>CAREER</span></div><button class="secondary" onclick="show('home')">ホーム</button><button class="secondary" onclick="show('dispatch')">人材派遣</button><button class="secondary" onclick="show('career')">就職支援</button><button class="secondary" onclick="show('auth')">学生ログイン</button><button class="secondary" onclick="show('companyAuth')">企業</button><button class="secondary" onclick="show('adminAuth')">管理者</button><button class="gray" onclick="logout()">ログアウト</button></div></header>
<main>
<section id="home" class="section active"><div class="hero"><div class="hero-inner"><div><h1>SOLA CAREER</h1><div class="lead">人材派遣・就職支援プラットフォーム</div><p>Supabase Auth 対応正式移行テスト版です。</p><button onclick="show('auth')">学生ログイン / 登録</button> <button class="blue" onclick="show('companyAuth')">企業の方はこちら</button></div><div class="hero-panel"><h2>安全ログイン対応</h2><p>パスワードは Supabase Auth 側で安全に管理されます。</p><p><span class="badge">学生</span><span class="badge">企業</span><span class="badge">管理者</span></p></div></div></div><div class="big-entry"><div class="entry dispatch" onclick="show('dispatch')"><h2>人材派遣</h2><p>短期・単発求人を確認できます。</p></div><div class="entry career" onclick="show('career')"><h2>就職支援</h2><p>就職求人を確認できます。</p></div></div></section>
<section id="auth" class="section"><div class="card"><h2>学生ログイン / 新規登録</h2><div id="studentMsg"></div><div class="row"><div><label>メール</label><input id="studentEmail" type="email"></div><div><label>パスワード</label><input id="studentPass" type="password"></div></div><div class="row"><div><label>氏名</label><input id="studentName"></div><div><label>電話番号</label><input id="studentTel"></div></div><button onclick="studentSignup()">学生新規登録</button> <button class="secondary" onclick="studentLogin()">学生ログイン</button></div></section>
<section id="companyAuth" class="section"><div class="card"><h2>企業ログイン / 新規登録</h2><div id="companyMsg"></div><div class="row"><div><label>メール</label><input id="companyEmail" type="email"></div><div><label>パスワード</label><input id="companyPass" type="password"></div></div><div class="row"><div><label>会社名</label><input id="companyName"></div><div><label>電話番号</label><input id="companyTel"></div></div><label>担当者名</label><input id="companyPerson"><button onclick="companySignup()">企業登録申請</button> <button class="secondary" onclick="companyLogin()">企業ログイン</button><p>※ 企業は管理者承認後に利用できます。</p></div></section>
<section id="adminAuth" class="section"><div class="card"><h2>管理者ログイン</h2><div id="adminMsg"></div><label>メール</label><input id="adminEmail" type="email" placeholder="admin@sola-career.com"><label>パスワード</label><input id="adminPass" type="password"><button onclick="adminLogin()">管理者ログイン</button></div></section>
<section id="dispatch" class="section"><div class="card"><h2>人材派遣求人</h2><div id="dispatchList"></div></div></section><section id="career" class="section"><div class="card"><h2>就職求人</h2><div id="careerList"></div></div></section><section id="dashboard" class="section"><div class="card"><h2 id="dashTitle">マイページ</h2><p id="dashInfo"></p><div class="tabs" id="dashTabs"></div><div id="dashContent"></div></div></section>
</main><footer><h2>SOLA CAREER</h2><p>プラットフォーム管理責任者：丁 超亜（Ding Chaoya）</p></footer>
<script>
const SUPABASE_URL='https://yhwdmlvzzrnvnnxapsfr.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_8ZhlfQc5zqU6xNEFduzymA__aBsJyzf';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let currentProfile=null;
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active'); if(id==='dispatch') loadJobs('dispatch'); if(id==='career') loadJobs('career');}
function val(id){return document.getElementById(id).value.trim();}function msg(id,text,type='ok'){document.getElementById(id).innerHTML='<div class="alert '+type+'">'+text+'</div>';}
async function getProfile(user){const r=await sb.from('user_profiles').select('*').eq('auth_user_id',user.id).maybeSingle(); if(r.error) throw r.error; return r.data;}
async function createProfile(user,role,extra){const profile={auth_user_id:user.id,email:user.email,role,name:extra.name||'',tel:extra.tel||'',status:role==='company'?'pending':'active'};const pr=await sb.from('user_profiles').insert(profile).select('*').single(); if(pr.error) throw pr.error;if(role==='student'){const sr=await sb.from('students').insert({auth_user_id:user.id,email:user.email,name:extra.name,tel:extra.tel,school:'SOLA学園'}).select('*').single(); if(sr.error) throw sr.error; await sb.from('user_profiles').update({student_id:sr.data.id}).eq('id',pr.data.id);}if(role==='company'){const cr=await sb.from('companies').insert({auth_user_id:user.id,email:user.email,company_name:extra.company_name,tel:extra.tel,contact_person:extra.contact_person,status:'pending'}).select('*').single(); if(cr.error) throw cr.error; await sb.from('user_profiles').update({company_id:cr.data.id}).eq('id',pr.data.id);}return pr.data;}
async function studentSignup(){try{msg('studentMsg','登録中...','info');const r=await sb.auth.signUp({email:val('studentEmail'),password:val('studentPass')}); if(r.error) throw r.error; await createProfile(r.data.user,'student',{name:val('studentName'),tel:val('studentTel')}); msg('studentMsg','学生登録が完了しました。','ok');}catch(e){msg('studentMsg','登録エラー：'+e.message,'err');}}
async function studentLogin(){try{msg('studentMsg','ログイン中...','info');const r=await sb.auth.signInWithPassword({email:val('studentEmail'),password:val('studentPass')}); if(r.error) throw r.error; const p=await getProfile(r.data.user); if(!p||p.role!=='student') throw new Error('学生プロフィールが見つかりません。'); openDashboard(p);}catch(e){msg('studentMsg','ログインエラー：'+e.message,'err');}}
async function companySignup(){try{msg('companyMsg','登録中...','info');const r=await sb.auth.signUp({email:val('companyEmail'),password:val('companyPass')}); if(r.error) throw r.error; await createProfile(r.data.user,'company',{company_name:val('companyName'),name:val('companyName'),tel:val('companyTel'),contact_person:val('companyPerson')}); msg('companyMsg','企業登録申請が完了しました。管理者承認後にログインできます。','ok');}catch(e){msg('companyMsg','登録エラー：'+e.message,'err');}}
async function companyLogin(){try{msg('companyMsg','ログイン中...','info');const r=await sb.auth.signInWithPassword({email:val('companyEmail'),password:val('companyPass')}); if(r.error) throw r.error; const p=await getProfile(r.data.user); if(!p||p.role!=='company') throw new Error('企業プロフィールが見つかりません。'); if(p.status!=='approved'&&p.status!=='active') throw new Error('管理者承認待ちです。'); openDashboard(p);}catch(e){msg('companyMsg','ログインエラー：'+e.message,'err');}}
async function adminLogin(){try{msg('adminMsg','ログイン中...','info');const r=await sb.auth.signInWithPassword({email:val('adminEmail'),password:val('adminPass')}); if(r.error) throw r.error; let p=await getProfile(r.data.user); if(!p&&r.data.user.email==='admin@sola-career.com'){const cr=await sb.from('user_profiles').insert({auth_user_id:r.data.user.id,email:r.data.user.email,role:'admin',name:'管理者',status:'active'}).select('*').single(); if(cr.error) throw cr.error; p=cr.data;} if(!p||p.role!=='admin') throw new Error('管理者プロフィールが見つかりません。'); openDashboard(p);}catch(e){msg('adminMsg','ログインエラー：'+e.message,'err');}}
function openDashboard(p){currentProfile=p;dashTitle.textContent=p.role==='admin'?'管理者ダッシュボード':p.role==='company'?'企業マイページ':'学生マイページ';dashInfo.textContent=p.email+' / '+p.role+' / '+p.status;renderTabs();show('dashboard');}
function renderTabs(){let tabs=''; if(currentProfile.role==='student'){tabs='<button onclick="studentHome()">学生情報</button><button onclick="loadJobs(\'dispatch\',true)">派遣求人</button><button onclick="loadJobs(\'career\',true)">就職求人</button>'; studentHome();} if(currentProfile.role==='company'){tabs='<button onclick="companyHome()">企業情報</button><button onclick="companyJobs()">自社求人</button><button onclick="companyApplicants()">応募学生</button>'; companyHome();} if(currentProfile.role==='admin'){tabs='<button onclick="adminHome()">統計</button><button onclick="adminCompanies()">企業承認</button><button onclick="adminStudents()">学生管理</button>'; adminHome();} dashTabs.innerHTML=tabs;}
function studentHome(){dashContent.innerHTML='<div class="alert ok">学生ログイン成功</div><p>求人を確認して応募できます。</p>';}function companyHome(){dashContent.innerHTML='<div class="alert ok">企業ログイン成功</div><p>求人管理・応募者確認を行えます。</p>';}
async function adminHome(){const s=await sb.from('students').select('id',{count:'exact',head:true});const c=await sb.from('companies').select('id',{count:'exact',head:true}); dashContent.innerHTML='<h3>統計</h3><p>学生数：'+(s.count||0)+' / 企業数：'+(c.count||0)+'</p>';}
async function loadJobs(kind,inside=false){const table=kind==='dispatch'?'dispatch_jobs':'career_jobs';const box=inside?dashContent:document.getElementById(kind==='dispatch'?'dispatchList':'careerList'); const r=await sb.from(table).select('*').eq('active',true).order('created_at',{ascending:false}); if(r.error){box.innerHTML='読込エラー：'+r.error.message;return;} let html=''; (r.data||[]).forEach(j=>{html+='<div class="job"><span class="badge">'+(kind==='dispatch'?'派遣':'就職')+'</span><h3>'+j.company+'</h3><p>'+ (j.job_type||'') +' / '+(j.work_place||'')+' / '+(j.pay||'')+'</p>'+(inside&&currentProfile.role==='student'?'<button onclick="applyJob(\''+kind+'\',\''+j.id+'\')">応募する</button>':'')+'</div>';}); box.innerHTML=html||'求人はありません。'; if(!inside) show(kind);}
async function applyJob(kind,id){const table=kind==='dispatch'?'dispatch_apps':'career_apps';const r=await sb.from(table).insert({job_id:id,student_id:currentProfile.student_id,status:'応募中'}); if(r.error){alert('応募エラー：'+r.error.message);return;} alert('応募しました。');}
async function companyJobs(){const d=await sb.from('dispatch_jobs').select('*').eq('company_id',currentProfile.company_id);const c=await sb.from('career_jobs').select('*').eq('company_id',currentProfile.company_id);let html='<h3>自社求人</h3>';[...(d.data||[]),...(c.data||[])].forEach(j=>html+='<div class="job"><h3>'+j.company+'</h3><p>'+j.job_type+' / '+j.pay+'</p></div>');dashContent.innerHTML=html||'求人はありません。';}
async function companyApplicants(){dashContent.innerHTML='<p>応募者確認機能は正式統合時に詳細表示へ接続します。</p>';}
async function adminCompanies(){const r=await sb.from('user_profiles').select('*').eq('role','company').order('created_at',{ascending:false});let rows='';(r.data||[]).forEach(c=>rows+='<tr><td>'+c.email+'</td><td>'+c.status+'</td><td><button onclick="approveCompany(\''+c.id+'\')">承認</button></td></tr>');dashContent.innerHTML='<table><tr><th>企業</th><th>状態</th><th>操作</th></tr>'+rows+'</table>';}
async function approveCompany(id){const p=await sb.from('user_profiles').update({status:'approved'}).eq('id',id).select('*').single(); if(p.error){alert(p.error.message);return;} if(p.data.company_id) await sb.from('companies').update({status:'approved'}).eq('id',p.data.company_id); alert('承認しました。'); adminCompanies();}
async function adminStudents(){const r=await sb.from('user_profiles').select('*').eq('role','student');let rows='';(r.data||[]).forEach(s=>rows+='<tr><td>'+s.email+'</td><td>'+s.name+'</td><td>'+s.status+'</td></tr>');dashContent.innerHTML='<table><tr><th>メール</th><th>氏名</th><th>状態</th></tr>'+rows+'</table>';}
async function logout(){await sb.auth.signOut();currentProfile=null;show('home');}
(async()=>{const r=await sb.auth.getUser(); if(r.data&&r.data.user){try{const p=await getProfile(r.data.user); if(p) openDashboard(p);}catch(e){}}})();
</script></body></html>
