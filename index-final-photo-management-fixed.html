<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLA CAREER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#32c904;--blue:#2563eb;--line:#e5e7eb;--bg:#fffdf7;--ink:#111827}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900;margin-right:auto}.logo span{color:var(--green)}
button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:8px 12px;font-weight:800;cursor:pointer;margin:2px;font-size:13px}
button.secondary{background:#e0f2fe;color:#0369a1}button.gray{background:#f1f5f9;color:#334155}button.red{background:#dc2626}button.blue{background:var(--blue)}
main{max-width:1450px;margin:10px auto;padding:0 6px}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.hero{background:linear-gradient(135deg,#ecffe4,#eef7ff);padding:34px 26px;border-radius:22px}.hero h1{font-size:34px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.entry{padding:18px;border-radius:18px;color:#fff;cursor:pointer}.dispatch{background:linear-gradient(135deg,#34d399,#0ea5e9)}.career{background:linear-gradient(135deg,#2563eb,#7c3aed)}
input,textarea,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0 10px;box-sizing:border-box;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}
.job{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:#fff}.badge{display:inline-block;border-radius:999px;background:#e0f2fe;color:#0369a1;padding:4px 10px;font-size:12px;font-weight:800;margin-right:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#f1f5f9;color:#334155}.tabs button.active{background:var(--green);color:#fff}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:14px;vertical-align:top}th{background:#f8fafc}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.stat-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stat-box b{font-size:30px;color:var(--green)}
.upload-box{border:2px dashed #cbd5e1;border-radius:16px;padding:18px;background:#f8fafc;margin:12px 0}.profile-photo{width:92px;height:112px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.file-link{display:inline-block;margin:4px 4px 4px 0;padding:6px 10px;border-radius:999px;background:#e0f2fe;color:#0369a1;text-decoration:none;font-weight:800;font-size:13px}
.job-card{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}.job-img{width:220px;height:140px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:#f8fafc}.job-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}.job-detail-cell{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:999;display:none;align-items:center;justify-content:center;padding:16px}.modal-bg.active{display:flex}.modal-panel{background:#fff;border-radius:20px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.hero h1{font-size:34px}.job-card{grid-template-columns:1fr}.job-img{width:100%;height:180px}}

.notice-card{border-left:6px solid #32c904;background:#f8fafc;border-radius:14px;padding:14px;margin:10px 0}
.notice-card.unread{background:#ecfeff;border-left-color:#0ea5e9}
.interview-form{background:#f8fafc;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0}

footer.site-footer{
  margin-top:28px;
  padding:12px 14px;
  background:#f8fafc;
  color:#475569;
  text-align:center;
  border-top:2px solid #32c904;
  font-size:13px;
  line-height:1.7;
}
footer.site-footer .footer-line{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
footer.site-footer span{
  white-space:nowrap;
}
@media(max-width:600px){
  footer.site-footer{
    font-size:12px;
    padding:10px 8px;
  }
  footer.site-footer .footer-line{
    flex-direction:column;
    gap:2px;
  }
  footer.site-footer span{
    white-space:normal;
  }
}
  footer.site-footer .footer-line{
    gap:4px 10px;
  }
  footer.site-footer span{
    white-space:normal;
  }
}


.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.photo-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.photo-thumb{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid #e5e7eb;background:#f8fafc}
.photo-empty{width:100%;aspect-ratio:3/4;border-radius:12px;border:1px dashed #cbd5e1;background:#f8fafc;color:#94a3b8;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}
.photo-card h4{margin:8px 0 4px;font-size:14px}
.photo-card p{margin:3px 0;font-size:12px;color:#64748b}
.photo-tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}

</style>
</head>
<body>
<header>
  <div class="logo">SOLA <span>CAREER</span></div>
  <button class="secondary" data-nav="home">ホーム</button>
  <button class="secondary" data-nav="studentLogin">学生</button>
  <button class="secondary" data-nav="companyLogin">企業</button>
  <button class="secondary" data-nav="adminLogin">管理者</button>
  <button class="secondary" id="navDispatch">人材派遣</button>
  <button class="secondary" id="navCareer">就職支援</button>
  <button class="gray" id="logoutBtn">ログアウト</button>
</header>
<main>
<section id="home" class="section active">
  <div class="hero"><h1>SOLA CAREER</h1><p>人材派遣・就職支援プラットフォーム</p><p>Auth Complete Stable</p></div>
  <div class="grid" style="margin-top:20px">
    <div class="entry dispatch" id="homeDispatch"><h2>人材派遣</h2><p>短期・単発・時間指定の求人</p></div>
    <div class="entry career" id="homeCareer"><h2>就職支援</h2><p>正社員・特定技能・長期雇用</p></div>
  </div>
</section>
<section id="studentLogin" class="section"><div class="card"><h2>学生ログイン / 新規登録</h2><div id="studentMsg"></div><div class="row"><div><label>メール</label><input id="studentEmail" type="email"></div><div><label>パスワード</label><input id="studentPass" type="password"></div></div><div class="row"><div><label>氏名</label><input id="studentName"></div><div><label>電話番号</label><input id="studentTel"></div></div><button id="studentSignupBtn">学生新規登録</button><button class="secondary" id="studentLoginBtn">学生ログイン</button></div></section>
<section id="companyLogin" class="section"><div class="card"><h2>企業ログイン / 新規登録</h2><div id="companyMsg"></div><div class="row"><div><label>メール</label><input id="companyEmail" type="email"></div><div><label>パスワード</label><input id="companyPass" type="password"></div></div><div class="row"><div><label>会社名</label><input id="companyName"></div><div><label>電話番号</label><input id="companyTel"></div></div><label>担当者名</label><input id="companyPerson"><button id="companySignupBtn">企業登録申請</button><button class="secondary" id="companyLoginBtn">企業ログイン</button></div></section>
<section id="adminLogin" class="section"><div class="card"><h2>管理者ログイン</h2><div id="adminMsg"></div><label>メール</label><input id="adminEmail" type="email" placeholder="admin@sola-career.com"><label>パスワード</label><input id="adminPass" type="password"><button id="adminLoginBtn">管理者ログイン</button></div></section>
<section id="publicDispatch" class="section"><div class="card"><h2>人材派遣求人</h2><div id="publicDispatchList"></div></div></section>
<section id="publicCareer" class="section"><div class="card"><h2>就職求人</h2><div id="publicCareerList"></div></div></section>
<section id="studentDash" class="section"><div class="card"><h2>学生マイページ</h2><p id="studentInfo"></p><div class="tabs"><button id="studentHomeBtn">学生情報</button><button id="studentDispatchBtn">派遣求人</button><button id="studentCareerBtn">就職求人</button><button id="studentAppsBtn">応募履歴</button>
      <button id="studentNoticesBtn" onclick="studentNotifications()">通知</button><button id="studentFilesBtn">履歴書・写真</button></div><div id="studentContent"></div></div></section>
<section id="companyDash" class="section"><div class="card"><h2>企業マイページ</h2><p id="companyInfo"></p><div class="tabs"><button id="companyHomeBtn">企業情報</button><button id="companyJobsBtn">自社求人</button><button id="companyAddJobBtn">求人投稿</button><button id="companyApplicantsBtn">応募学生</button>
      <button id="companyInterviewsBtn" onclick="companyInterviews()">面接管理</button></div><div id="companyContent"></div></div></section>
<section id="adminDash" class="section"><div class="card"><h2>管理者ダッシュボード</h2><p id="adminInfo"></p><div class="tabs"><button id="adminStatsBtn">統計</button><button id="adminCompaniesBtn">企業承認</button><button id="adminStudentsBtn">学生管理</button><button id="adminFilesBtn">履歴書管理</button>
      <button id="adminPhotosBtn" onclick="adminPhotos('all')">証明写真管理</button><button id="adminApplicationsBtn">応募管理</button>
      <button id="adminInterviewsBtn" onclick="adminInterviews()">面接管理</button>
      <button id="adminNotificationsBtn" onclick="adminNotifications()">通知管理</button><button id="adminJobsBtn">求人管理</button></div><div id="adminContent"></div></div></section>
</main>
<div id="jobDetailModal" class="modal-bg"><div class="modal-panel"><button class="gray" id="closeJobDetailBtn">閉じる</button><div id="jobDetailContent"></div></div></div>
<div id="jobEditModal" class="modal-bg"><div class="modal-panel"><button class="gray" id="closeJobEditBtn">閉じる</button><h2>求人編集</h2><input type="hidden" id="editJobKind"><input type="hidden" id="editJobId"><div class="row"><div><label>会社名</label><input id="editJobCompany"></div><div><label>職種</label><input id="editJobType"></div></div><label>仕事内容</label><textarea id="editJobWork"></textarea><label>詳細説明</label><textarea id="editJobDetail"></textarea><div class="row"><div><label>勤務地</label><input id="editJobPlace"></div><div><label>勤務日・勤務時間 / 雇用形態</label><input id="editJobTime"></div></div><div class="row"><div><label>給与</label><input id="editJobPay"></div><div><label>募集人数</label><input id="editJobQuota" type="number"></div></div><div class="row"><div><label>新しい求人画像</label><input id="editJobImage" type="file" accept="image/*"></div><div><label>地図URL</label><input id="editJobMapUrl"></div></div><div class="row"><div><label>交通費</label><input id="editJobTransport"></div><div><label>制服</label><input id="editJobUniform"></div></div><div class="row"><div><label>外国人応募</label><input id="editJobForeigner"></div><div><label>応募締切</label><input id="editJobDeadline"></div></div><button id="saveJobEditBtn">保存</button></div></div>
<script>
const SUPABASE_URL='https://yhwdmlvzzrnvnnxapsfr.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_8ZhlfQc5zqU6xNEFduzymA__aBsJyzf';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentProfile=null;
function showSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function msg(id,text,type='ok'){const el=document.getElementById(id);if(el)el.innerHTML='<div class="alert '+type+'">'+escapeHtml(text)+'</div>';}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function num(v){return v||0;}
async function getProfile(user){const r=await sb.from('user_profiles').select('*').eq('auth_user_id',user.id).maybeSingle();if(r.error)throw r.error;return r.data;}
async function createProfile(user,role,extra){const profile={auth_user_id:user.id,email:user.email,role,name:extra.name||'',tel:extra.tel||'',status:role==='company'?'pending':'active'};const pr=await sb.from('user_profiles').insert(profile).select('*').single();if(pr.error)throw pr.error;if(role==='student'){const sr=await sb.from('students').insert({auth_user_id:user.id,email:user.email,name:extra.name,tel:extra.tel,school:'SOLA学園'}).select('*').single();if(sr.error)throw sr.error;await sb.from('user_profiles').update({student_id:sr.data.id}).eq('id',pr.data.id);}if(role==='company'){const cr=await sb.from('companies').insert({auth_user_id:user.id,email:user.email,company_name:extra.company_name,tel:extra.tel,contact_person:extra.contact_person,status:'pending'}).select('*').single();if(cr.error)throw cr.error;await sb.from('user_profiles').update({company_id:cr.data.id}).eq('id',pr.data.id);}}
async function studentSignup(){try{msg('studentMsg','登録中...','info');const r=await sb.auth.signUp({email:val('studentEmail'),password:val('studentPass')});if(r.error)throw r.error;await createProfile(r.data.user,'student',{name:val('studentName'),tel:val('studentTel')});msg('studentMsg','学生登録成功','ok');}catch(e){msg('studentMsg','登録エラー：'+e.message,'err');}}
async function studentLogin(){try{msg('studentMsg','ログイン中...','info');const r=await sb.auth.signInWithPassword({email:val('studentEmail'),password:val('studentPass')});if(r.error)throw r.error;const p=await getProfile(r.data.user);if(!p||p.role!=='student')throw new Error('学生プロフィールが見つかりません');currentProfile=p;document.getElementById('studentInfo').textContent=p.email+' / '+p.status;showSection('studentDash');studentHome();}catch(e){msg('studentMsg','ログインエラー：'+e.message,'err');}}
async function companySignup(){try{msg('companyMsg','登録中...','info');const r=await sb.auth.signUp({email:val('companyEmail'),password:val('companyPass')});if(r.error)throw r.error;await createProfile(r.data.user,'company',{company_name:val('companyName'),name:val('companyName'),tel:val('companyTel'),contact_person:val('companyPerson')});msg('companyMsg','企業登録申請完了。管理者承認後にログインできます。','ok');}catch(e){msg('companyMsg','登録エラー：'+e.message,'err');}}
async function companyLogin(){try{msg('companyMsg','ログイン中...','info');const r=await sb.auth.signInWithPassword({email:val('companyEmail'),password:val('companyPass')});if(r.error)throw r.error;const p=await getProfile(r.data.user);if(!p||p.role!=='company')throw new Error('企業プロフィールが見つかりません');if(p.status!=='approved'&&p.status!=='active')throw new Error('管理者承認待ちです');currentProfile=p;document.getElementById('companyInfo').textContent=p.email+' / '+p.status;showSection('companyDash');companyHome();}catch(e){msg('companyMsg','ログインエラー：'+e.message,'err');}}
async function adminLogin(){try{msg('adminMsg','ログイン中...','info');const r=await sb.auth.signInWithPassword({email:val('adminEmail'),password:val('adminPass')});if(r.error)throw r.error;let p=await getProfile(r.data.user);if(!p&&r.data.user.email==='admin@sola-career.com'){const cr=await sb.from('user_profiles').insert({auth_user_id:r.data.user.id,email:r.data.user.email,role:'admin',name:'管理者',status:'active'}).select('*').single();if(cr.error)throw cr.error;p=cr.data;}if(!p||p.role!=='admin')throw new Error('管理者プロフィールが見つかりません');currentProfile=p;document.getElementById('adminInfo').textContent=p.email+' / '+p.status;showSection('adminDash');adminStats();}catch(e){msg('adminMsg','ログインエラー：'+e.message,'err');}}
function studentHome(){document.getElementById('studentContent').innerHTML='<div class="alert ok">学生ログイン成功</div><p>求人確認・応募・履歴書アップロードができます。</p><button id="quickFileBtn">履歴書・写真を登録する</button>';document.getElementById('quickFileBtn').addEventListener('click',studentFileForm);}
function renderJobCard(job,kind,opt={}){const img=job.photo_url||job.image_url||'';let h='<div class="job job-card">';h+=img?'<img class="job-img" src="'+escapeHtml(img)+'">':'<div class="job-img" style="display:flex;align-items:center;justify-content:center;color:#94a3b8">No Image</div>';h+='<div><span class="badge">'+(kind==='dispatch'?'派遣':'就職')+'</span><h3>'+escapeHtml(job.company)+'</h3><p><b>'+escapeHtml(job.job_type)+'</b></p><div class="job-detail-grid"><div class="job-detail-cell">勤務地<br><b>'+escapeHtml(job.work_place)+'</b></div><div class="job-detail-cell">給与<br><b>'+escapeHtml(job.pay)+'</b></div><div class="job-detail-cell">勤務時間/雇用形態<br><b>'+escapeHtml(job.work_time||job.employment_type||'')+'</b></div><div class="job-detail-cell">外国人応募<br><b>'+escapeHtml(job.foreigner_ok||'可')+'</b></div></div><button class="secondary detail-btn" data-kind="'+kind+'" data-id="'+job.id+'">詳細を見る</button>';if(opt.apply)h+='<button class="apply-btn" data-kind="'+kind+'" data-id="'+job.id+'">応募する</button>';if(opt.manage)h+='<div class="action-row"><button class="edit-job-btn secondary" data-kind="'+kind+'" data-id="'+job.id+'">編集</button><button class="toggle-job-btn gray" data-kind="'+kind+'" data-id="'+job.id+'" data-active="'+job.active+'">'+(job.active?'掲載停止':'再掲載')+'</button><button class="delete-job-btn red" data-kind="'+kind+'" data-id="'+job.id+'">削除</button></div>';h+='</div></div>';return h;}
function bindJobButtons(box){box.querySelectorAll('.detail-btn').forEach(b=>b.addEventListener('click',()=>openJobDetail(b.dataset.kind,b.dataset.id)));box.querySelectorAll('.apply-btn').forEach(b=>b.addEventListener('click',()=>applyJob(b.dataset.kind,b.dataset.id)));box.querySelectorAll('.edit-job-btn').forEach(b=>b.addEventListener('click',()=>openJobEdit(b.dataset.kind,b.dataset.id)));box.querySelectorAll('.toggle-job-btn').forEach(b=>b.addEventListener('click',()=>toggleJobActive(b.dataset.kind,b.dataset.id,b.dataset.active)));box.querySelectorAll('.delete-job-btn').forEach(b=>b.addEventListener('click',()=>deleteJob(b.dataset.kind,b.dataset.id)));}
async function loadStudentJobs(kind){const table=kind==='dispatch'?'dispatch_jobs':'career_jobs';const r=await sb.from(table).select('*').eq('active',true).order('created_at',{ascending:false});if(r.error){document.getElementById('studentContent').innerHTML='読込エラー：'+escapeHtml(r.error.message);return;}let h='';(r.data||[]).forEach(j=>h+=renderJobCard(j,kind,{apply:true}));const box=document.getElementById('studentContent');box.innerHTML=h||'求人はありません';bindJobButtons(box);}
async function applyJob(kind,id){if(!currentProfile||currentProfile.role!=='student'){alert('学生ログインが必要です');return;}if(!currentProfile.student_id){alert('学生IDが未連携です。');return;}const table=kind==='dispatch'?'dispatch_apps':'career_apps';const r=await sb.from(table).insert({job_id:id,student_id:currentProfile.student_id,status:'応募中'});if(r.error){alert('応募エラー：'+r.error.message);return;}alert('応募しました');}
async function studentApplications(){let rows='';const d=await sb.from('dispatch_apps').select('*,dispatch_jobs(company,job_type)').eq('student_id',currentProfile.student_id).order('created_at',{ascending:false});const c=await sb.from('career_apps').select('*,career_jobs(company,job_type)').eq('student_id',currentProfile.student_id).order('created_at',{ascending:false});(d.data||[]).forEach(a=>rows+='<tr><td>派遣</td><td>'+escapeHtml(a.dispatch_jobs?.company)+'</td><td>'+escapeHtml(a.dispatch_jobs?.job_type)+'</td><td>'+escapeHtml(a.status)+'</td></tr>');(c.data||[]).forEach(a=>rows+='<tr><td>就職</td><td>'+escapeHtml(a.career_jobs?.company)+'</td><td>'+escapeHtml(a.career_jobs?.job_type)+'</td><td>'+escapeHtml(a.status)+'</td></tr>');document.getElementById('studentContent').innerHTML='<h3>応募履歴</h3><table><tr><th>区分</th><th>企業</th><th>職種</th><th>状態</th></tr>'+rows+'</table>';}
function studentFileForm(){const resume=currentProfile.resume_url?'<a class="file-link" href="'+escapeHtml(currentProfile.resume_url)+'" target="_blank">現在の履歴書PDFを見る</a>':'未登録';const photo=currentProfile.photo_url?'<img class="profile-photo" src="'+escapeHtml(currentProfile.photo_url)+'"><br><a class="file-link" href="'+escapeHtml(currentProfile.photo_url)+'" target="_blank">現在の証明写真を見る</a>':'未登録';document.getElementById('studentContent').innerHTML='<h3>履歴書・証明写真</h3><div class="upload-box"><p><b>履歴書PDF：</b>'+resume+'</p><p><b>証明写真：</b>'+photo+'</p></div><div class="upload-box"><label>履歴書PDF</label><input id="resumeFile" type="file" accept="application/pdf"><label>証明写真</label><input id="photoFile" type="file" accept="image/*"><button id="uploadStudentFilesBtn">アップロードして保存</button></div>';document.getElementById('uploadStudentFilesBtn').addEventListener('click',uploadStudentFiles);}

async function uploadJobImage(id){const input=document.getElementById(id);if(!input||!input.files||!input.files[0])return null;const file=input.files[0];const ext=file.name.split('.').pop();const path='job-images/'+String(currentProfile?.email||'company').replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now()+'.'+ext;const r=await sb.storage.from('photos').upload(path,file,{upsert:true});if(r.error)throw r.error;return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;}

async function ensureCompanyId(){
  if(!currentProfile || currentProfile.role !== 'company'){
    throw new Error('企業ログインが必要です');
  }

  if(currentProfile.company_id && currentProfile.company_id !== 'null'){
    return currentProfile.company_id;
  }

  let companyResult = await sb.from('companies')
    .select('*')
    .eq('auth_user_id', currentProfile.auth_user_id)
    .maybeSingle();

  if(companyResult.error) throw companyResult.error;

  if(!companyResult.data){
    companyResult = await sb.from('companies')
      .select('*')
      .eq('email', currentProfile.email)
      .maybeSingle();

    if(companyResult.error) throw companyResult.error;
  }

  if(!companyResult.data){
    throw new Error('企業情報が見つかりません。管理者に確認してください。');
  }

  currentProfile.company_id = companyResult.data.id;

  await sb.from('user_profiles')
    .update({company_id: companyResult.data.id})
    .eq('id', currentProfile.id);

  return companyResult.data.id;
}

async function companyApplicants(){

  const dispatchIds = (dispatchJobs.data || []).map(job => job.id);

  let rows = '';

  if(dispatchIds.length){
    const result = await sb.from('dispatch_apps')
      .select('*,students(id,name,email,tel,resume_url),dispatch_jobs(job_type,company_id)')
      .in('job_id', dispatchIds)
      .order('created_at', {ascending:false});

        '<button class="status-btn" data-table="dispatch_apps" data-id="' + app.id + '" data-status="不採用">不採用</button>' +
        '</td></tr>';
    });
  }

  if(careerIds.length){
    const result = await sb.from('career_apps')
      .select('*,students(id,name,email,tel,resume_url),career_jobs(job_type,company_id)')
      .in('job_id', careerIds)
      .order('created_at', {ascending:false});

    (result.data || []).forEach(app => {
      rows += '<tr><td>就職</td><td>' + escapeHtml(app.career_jobs?.job_type) + '</td><td>' + escapeHtml(app.students?.name) + '<br>' + escapeHtml(app.students?.email) + '<br>' + escapeHtml(app.students?.tel) + '</td><td>' + escapeHtml(app.status) + '</td><td>' +
        '<button class="create-interview-btn" data-table="career_apps" data-id="' + app.id + '" data-student="' + app.student_id + '" data-company="' + app.career_jobs?.company_id + '">面接案内</button>' +
        '<button class="status-btn" data-table="career_apps" data-id="' + app.id + '" data-status="内定">内定</button>' +
        '<button class="status-btn" data-table="career_apps" data-id="' + app.id + '" data-status="不採用">不採用</button>' +
        '</td></tr>';
    });
  }

  document.getElementById('companyContent').innerHTML =
    '<h3>応募学生</h3>' +
    (rows ? '<table><tr><th>区分</th><th>職種</th><th>学生</th><th>状態</th><th>操作</th></tr>' + rows + '</table>' : '応募学生はまだありません。');

  document.querySelectorAll('.status-btn').forEach(button => {
    button.addEventListener('click', () => updateAppStatus(button.dataset.table, button.dataset.id, button.dataset.status));
  });

  document.querySelectorAll('.create-interview-btn').forEach(button => {
    button.addEventListener('click', () => createInterviewFromApp(button.dataset.table, button.dataset.id, button.dataset.student, button.dataset.company));
  });
}

function fileLinks(student){
  let html = '';

  if(student && student.resume_url){
    html += '<a class="file-link" href="' + escapeHtml(student.resume_url) + '" target="_blank">履歴書PDF</a> ';
  }

  if(student && student.photo_url){
    html += '<a class="file-link" href="' + escapeHtml(student.photo_url) + '" target="_blank">証明写真</a>';
  }

  return html || '未登録';
}


async function adminPhotos(filter = 'all'){
  const result = await sb.from('students')
    .select('id,name,email,tel,photo_url,resume_url,created_at')
    .order('created_at', {ascending:false});

  if(result.error){
    document.getElementById('adminContent').innerHTML = '証明写真読込エラー：' + escapeHtml(result.error.message);
    return;
  }

  let students = result.data || [];

  if(filter === 'uploaded'){
    students = students.filter(student => !!student.photo_url);
  }

  if(filter === 'missing'){
    students = students.filter(student => !student.photo_url);
  }

  let html = '<h3>証明写真管理</h3>';
  html += '<div class="photo-tools">';
  html += '<button class="photo-filter-btn" data-filter="all">全員</button>';
  html += '<button class="photo-filter-btn secondary" data-filter="uploaded">写真あり</button>';
  html += '<button class="photo-filter-btn gray" data-filter="missing">未アップロード</button>';
  html += '</div>';
  html += '<div class="photo-grid">';

  students.forEach(student => {
    html += '<div class="photo-card">';

    if(student.photo_url){
      html += '<a href="' + escapeHtml(student.photo_url) + '" target="_blank">';
      html += '<img class="photo-thumb" src="' + escapeHtml(student.photo_url) + '" alt="証明写真">';
      html += '</a>';
    }else{
      html += '<div class="photo-empty">写真未登録</div>';
    }

    html += '<h4>' + escapeHtml(student.name || '氏名未入力') + '</h4>';
    html += '<p>' + escapeHtml(student.email || '') + '</p>';
    html += '<p>' + escapeHtml(student.tel || '') + '</p>';

    if(student.photo_url){
      html += '<a class="file-link" href="' + escapeHtml(student.photo_url) + '" target="_blank">写真を開く</a>';
    }

    if(student.resume_url){
      html += '<a class="file-link" href="' + escapeHtml(student.resume_url) + '" target="_blank">履歴書PDF</a>';
    }

    html += '</div>';
  });

  html += '</div>';
  document.getElementById('adminContent').innerHTML = html;

  document.querySelectorAll('.photo-filter-btn').forEach(button => {
    button.addEventListener('click', () => adminPhotos(button.dataset.filter));
  });
}

async function saveJobEdit(){try{const kind=val('editJobKind'),id=val('editJobId'),table=kind==='dispatch'?'dispatch_jobs':'career_jobs';const image=await uploadJobImage('editJobImage');const payload={company:val('editJobCompany'),job_type:val('editJobType'),work_content:val('editJobWork'),detail_description:val('editJobDetail'),work_place:val('editJobPlace'),pay:val('editJobPay'),map_url:val('editJobMapUrl'),transportation:val('editJobTransport'),uniform:val('editJobUniform'),foreigner_ok:val('editJobForeigner'),deadline:val('editJobDeadline')};if(image){payload.photo_url=image;payload.image_url=image;}if(kind==='dispatch'){payload.work_time=val('editJobTime');payload.quota=Number(val('editJobQuota')||1);}else payload.employment_type=val('editJobTime');const r=await sb.from(table).update(payload).eq('id',id);if(r.error)throw r.error;alert('保存しました');jobEditModal.classList.remove('active');if(currentProfile?.role==='company')companyJobs();if(currentProfile?.role==='admin')adminJobs();}catch(e){alert('保存エラー：'+e.message);}}
async function toggleJobActive(kind,id,active){const table=kind==='dispatch'?'dispatch_jobs':'career_jobs';const next=!(String(active)==='true');const r=await sb.from(table).update({active:next}).eq('id',id);if(r.error){alert('更新エラー：'+r.error.message);return;}alert(next?'再掲載しました':'掲載停止しました');if(currentProfile?.role==='company')companyJobs();if(currentProfile?.role==='admin')adminJobs();}
async function deleteJob(kind,id){if(!confirm('この求人を削除しますか？'))return;const table=kind==='dispatch'?'dispatch_jobs':'career_jobs';const r=await sb.from(table).delete().eq('id',id);if(r.error){alert('削除エラー：'+r.error.message);return;}alert('削除しました');if(currentProfile?.role==='company')companyJobs();if(currentProfile?.role==='admin')adminJobs();}

async function createStudentNotification(studentId, title, message, type){
  if(!studentId) return;
  try{
    await sb.from('notifications').insert({
      student_id: studentId,
      title: title,
      message: message,
      type: type || 'notice',
      is_read: false
    });
  }catch(error){
    console.warn('notification error', error);
  }
}

async function studentNotifications(){
  document.getElementById('studentContent').innerHTML = '<div class="alert info">通知を読み込み中...</div>';
  if(!currentProfile || currentProfile.role !== 'student') return;

  const result = await sb.from('notifications')
    .select('*')
    .eq('student_id', currentProfile.student_id)
    .order('created_at', {ascending:false});

  if(result.error){
    document.getElementById('studentContent').innerHTML = '通知読込エラー：' + escapeHtml(result.error.message);
    return;
  }

  let html = '<h3>通知</h3>';

  (result.data || []).forEach(notice => {
    html += '<div class="notice-card ' + (notice.is_read ? '' : 'unread') + '">' +
      '<span class="badge">' + escapeHtml(notice.type || 'notice') + '</span>' +
      '<h3>' + escapeHtml(notice.title) + '</h3>' +
      '<p style="white-space:pre-line">' + escapeHtml(notice.message) + '</p>' +
      '<p><small>' + new Date(notice.created_at).toLocaleString() + '</small></p>' +
      '</div>';
  });

  document.getElementById('studentContent').innerHTML = html || '通知はありません。';

  await sb.from('notifications').update({is_read:true}).eq('student_id', currentProfile.student_id);
}

async function createInterviewFromApp(tableName, appId, studentId, companyId){
  const date = prompt('面接日時を入力してください。例：6月20日 15:00');
  if(!date) return;

  const place = prompt('面接場所を入力してください。例：会社事務所 / Zoom');
  if(!place) return;

  const memo = prompt('学生へのメッセージ・持ち物などを入力してください。') || '';

  const result = await sb.from('interviews').insert({
    app_table: tableName,
    app_id: appId,
    student_id: studentId,
    company_id: companyId,
    interview_datetime: date,
    interview_place: place,
    message: memo,
    status: '面接予定'
  });

  if(result.error){
    alert('面接登録エラー：' + result.error.message);
    return;
  }

  await sb.from(tableName).update({status:'面接予定'}).eq('id', appId);

  await createStudentNotification(
    studentId,
    '面接案内',
    '面接日時：' + date + '\n面接場所：' + place + '\n' + memo,
    'interview'
  );

  alert('面接案内を登録し、学生へ通知しました。');

  if(currentProfile.role === 'company') companyApplicants();
  if(currentProfile.role === 'admin') adminApplications();
}

async function companyInterviews(){
  document.getElementById('companyContent').innerHTML = '<div class="alert info">面接管理を読み込み中...</div>';
  await ensureCompanyId();

  const result = await sb.from('interviews')
    .select('*,students(name,email,tel)')
    .eq('company_id', currentProfile.company_id)
    .order('created_at', {ascending:false});

  if(result.error){
    document.getElementById('companyContent').innerHTML = '面接読込エラー：' + escapeHtml(result.error.message);
    return;
  }

  let rows = '';
  (result.data || []).forEach(item => {
    rows += '<tr><td>' + escapeHtml(item.interview_datetime) + '</td><td>' + escapeHtml(item.interview_place) + '</td><td>' + escapeHtml(item.students?.name) + '<br>' + escapeHtml(item.students?.email) + '</td><td>' + escapeHtml(item.status) + '</td><td>' +
      '<button class="interview-status-btn" data-id="' + item.id + '" data-status="面接済">面接済</button>' +
      '<button class="interview-status-btn" data-id="' + item.id + '" data-status="採用">採用</button>' +
      '<button class="interview-status-btn" data-id="' + item.id + '" data-status="不採用">不採用</button>' +
      '</td></tr>';
  });

  document.getElementById('companyContent').innerHTML =
    '<h3>面接管理</h3>' +
    (rows ? '<table><tr><th>日時</th><th>場所</th><th>学生</th><th>状態</th><th>操作</th></tr>' + rows + '</table>' : '面接予定はありません。');

  document.querySelectorAll('.interview-status-btn').forEach(button => {
    button.addEventListener('click', () => updateInterviewStatus(button.dataset.id, button.dataset.status));
  });
}

async function updateInterviewStatus(interviewId, status){
  const result = await sb.from('interviews')
    .update({status: status})
    .eq('id', interviewId)
    .select('*')
    .single();

  if(result.error){
    alert('更新エラー：' + result.error.message);
    return;
  }

  await createStudentNotification(
    result.data.student_id,
    '面接結果・状態更新',
    '面接状態が「' + status + '」に更新されました。',
    'interview_status'
  );

  alert('更新しました');

  if(currentProfile.role === 'company') companyInterviews();
  if(currentProfile.role === 'admin') adminInterviews();
}
