<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLA CAREER｜Auth Stable Clean</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#32c904;--blue:#2563eb;--line:#e5e7eb;--bg:#fffdf7;--ink:#111827}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900;margin-right:auto}.logo span{color:var(--green)}
button{border:0;border-radius:10px;background:var(--green);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer;margin:3px}
button.secondary{background:#e0f2fe;color:#0369a1}button.gray{background:#f1f5f9;color:#334155}button.red{background:#dc2626}button.blue{background:var(--blue)}
main{max-width:1100px;margin:24px auto;padding:0 14px}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(15,23,42,.06)}
.hero{background:linear-gradient(135deg,#ecffe4,#eef7ff);padding:50px 24px;border-radius:28px}.hero h1{font-size:46px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.entry{padding:28px;border-radius:22px;color:#fff;cursor:pointer}.dispatch{background:linear-gradient(135deg,#34d399,#0ea5e9)}.career{background:linear-gradient(135deg,#2563eb,#7c3aed)}
input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 14px;box-sizing:border-box;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alert{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}
.job{border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;background:#fff}.badge{display:inline-block;border-radius:999px;background:#e0f2fe;color:#0369a1;padding:4px 10px;font-size:12px;font-weight:800;margin-right:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#f1f5f9;color:#334155}.tabs button.active{background:var(--green);color:#fff}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:14px;vertical-align:top}th{background:#f8fafc}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.stat-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stat-box b{font-size:30px;color:var(--green)}
@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>
</head>
<body>

<header>
  <div class="logo">SOLA <span>CAREER</span></div>
  <button class="secondary" data-nav="home">ホーム</button>
  <button class="secondary" data-nav="studentLogin">学生</button>
  <button class="secondary" data-nav="companyLogin">企業</button>
  <button class="secondary" data-nav="adminLogin">管理者</button>
  <button class="secondary" id="navDispatch">人材派遣</button>
  <button class="secondary" id="navCareer">就職支援</button>
  <button class="gray" id="logoutBtn">ログアウト</button>
</header>

<main>
<section id="home" class="section active">
  <div class="hero">
    <h1>SOLA CAREER</h1>
    <p>人材派遣・就職支援プラットフォーム</p>
    <p>Auth Stable Clean</p>
  </div>
  <div class="grid" style="margin-top:20px">
    <div class="entry dispatch" id="homeDispatch"><h2>人材派遣</h2><p>短期・単発・時間指定の求人</p></div>
    <div class="entry career" id="homeCareer"><h2>就職支援</h2><p>正社員・特定技能・長期雇用</p></div>
  </div>
</section>

<section id="studentLogin" class="section">
  <div class="card">
    <h2>学生ログイン / 新規登録</h2>
    <div id="studentMsg"></div>
    <div class="row"><div><label>メール</label><input id="studentEmail" type="email"></div><div><label>パスワード</label><input id="studentPass" type="password"></div></div>
    <div class="row"><div><label>氏名</label><input id="studentName"></div><div><label>電話番号</label><input id="studentTel"></div></div>
    <button id="studentSignupBtn">学生新規登録</button>
    <button class="secondary" id="studentLoginBtn">学生ログイン</button>
  </div>
</section>

<section id="companyLogin" class="section">
  <div class="card">
    <h2>企業ログイン / 新規登録</h2>
    <div id="companyMsg"></div>
    <div class="row"><div><label>メール</label><input id="companyEmail" type="email"></div><div><label>パスワード</label><input id="companyPass" type="password"></div></div>
    <div class="row"><div><label>会社名</label><input id="companyName"></div><div><label>電話番号</label><input id="companyTel"></div></div>
    <label>担当者名</label><input id="companyPerson">
    <button id="companySignupBtn">企業登録申請</button>
    <button class="secondary" id="companyLoginBtn">企業ログイン</button>
  </div>
</section>

<section id="adminLogin" class="section">
  <div class="card">
    <h2>管理者ログイン</h2>
    <div id="adminMsg"></div>
    <label>メール</label><input id="adminEmail" type="email" placeholder="admin@sola-career.com">
    <label>パスワード</label><input id="adminPass" type="password">
    <button id="adminLoginBtn">管理者ログイン</button>
  </div>
</section>

<section id="publicDispatch" class="section"><div class="card"><h2>人材派遣求人</h2><div id="publicDispatchList"></div></div></section>
<section id="publicCareer" class="section"><div class="card"><h2>就職求人</h2><div id="publicCareerList"></div></div></section>

<section id="studentDash" class="section">
  <div class="card">
    <h2>学生マイページ</h2><p id="studentInfo"></p>
    <div class="tabs">
      <button id="studentHomeBtn">学生情報</button>
      <button id="studentDispatchBtn">派遣求人</button>
      <button id="studentCareerBtn">就職求人</button>
      <button id="studentAppsBtn">応募履歴</button>
    </div>
    <div id="studentContent"></div>
  </div>
</section>

<section id="companyDash" class="section">
  <div class="card">
    <h2>企業マイページ</h2><p id="companyInfo"></p>
    <div class="tabs">
      <button id="companyHomeBtn">企業情報</button>
      <button id="companyJobsBtn">自社求人</button>
      <button id="companyAddJobBtn">求人投稿</button>
      <button id="companyApplicantsBtn">応募学生</button>
    </div>
    <div id="companyContent"></div>
  </div>
</section>

<section id="adminDash" class="section">
  <div class="card">
    <h2>管理者ダッシュボード</h2><p id="adminInfo"></p>
    <div class="tabs">
      <button id="adminStatsBtn">統計</button>
      <button id="adminCompaniesBtn">企業承認</button>
      <button id="adminStudentsBtn">学生管理</button>
      <button id="adminApplicationsBtn">応募管理</button>
      <button id="adminJobsBtn">求人管理</button>
    </div>
    <div id="adminContent"></div>
  </div>
</section>
</main>

<script>
const SUPABASE_URL = 'https://yhwdmlvzzrnvnnxapsfr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8ZhlfQc5zqU6xNEFduzymA__aBsJyzf';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentProfile = null;

function showSection(id){
  document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
  const target = document.getElementById(id);
  if(target) target.classList.add('active');
}

function val(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function msg(id, text, type = 'ok'){
  const el = document.getElementById(id);
  if(el) el.innerHTML = '<div class="alert ' + type + '">' + escapeHtml(text) + '</div>';
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, function(match){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[match];
  });
}

function numberOrZero(value){
  return value || 0;
}

async function getProfile(user){
  const result = await sb.from('user_profiles').select('*').eq('auth_user_id', user.id).maybeSingle();
  if(result.error) throw result.error;
  return result.data;
}

async function createProfile(user, role, extra){
  const profilePayload = {
    auth_user_id: user.id,
    email: user.email,
    role: role,
    name: extra.name || '',
    tel: extra.tel || '',
    status: role === 'company' ? 'pending' : 'active'
  };

  const profileResult = await sb.from('user_profiles').insert(profilePayload).select('*').single();
  if(profileResult.error) throw profileResult.error;

  if(role === 'student'){
    const studentResult = await sb.from('students').insert({
      auth_user_id: user.id,
      email: user.email,
      name: extra.name,
      tel: extra.tel,
      school: 'SOLA学園'
    }).select('*').single();

    if(studentResult.error) throw studentResult.error;

    await sb.from('user_profiles').update({student_id: studentResult.data.id}).eq('id', profileResult.data.id);
  }

  if(role === 'company'){
    const companyResult = await sb.from('companies').insert({
      auth_user_id: user.id,
      email: user.email,
      company_name: extra.company_name,
      tel: extra.tel,
      contact_person: extra.contact_person,
      status: 'pending'
    }).select('*').single();

    if(companyResult.error) throw companyResult.error;

    await sb.from('user_profiles').update({company_id: companyResult.data.id}).eq('id', profileResult.data.id);
  }
}

async function studentSignup(){
  try{
    msg('studentMsg', '登録中...', 'info');
    const result = await sb.auth.signUp({
      email: val('studentEmail'),
      password: val('studentPass')
    });

    if(result.error) throw result.error;

    await createProfile(result.data.user, 'student', {
      name: val('studentName'),
      tel: val('studentTel')
    });

    msg('studentMsg', '学生登録成功', 'ok');
  }catch(error){
    msg('studentMsg', '登録エラー：' + error.message, 'err');
  }
}

async function studentLogin(){
  try{
    msg('studentMsg', 'ログイン中...', 'info');
    const result = await sb.auth.signInWithPassword({
      email: val('studentEmail'),
      password: val('studentPass')
    });

    if(result.error) throw result.error;

    const profile = await getProfile(result.data.user);
    if(!profile || profile.role !== 'student') throw new Error('学生プロフィールが見つかりません');

    currentProfile = profile;
    document.getElementById('studentInfo').textContent = profile.email + ' / ' + profile.status;
    showSection('studentDash');
    studentHome();
  }catch(error){
    msg('studentMsg', 'ログインエラー：' + error.message, 'err');
  }
}

async function companySignup(){
  try{
    msg('companyMsg', '登録中...', 'info');
    const result = await sb.auth.signUp({
      email: val('companyEmail'),
      password: val('companyPass')
    });

    if(result.error) throw result.error;

    await createProfile(result.data.user, 'company', {
      company_name: val('companyName'),
      name: val('companyName'),
      tel: val('companyTel'),
      contact_person: val('companyPerson')
    });

    msg('companyMsg', '企業登録申請完了。管理者承認後にログインできます。', 'ok');
  }catch(error){
    msg('companyMsg', '登録エラー：' + error.message, 'err');
  }
}

async function companyLogin(){
  try{
    msg('companyMsg', 'ログイン中...', 'info');
    const result = await sb.auth.signInWithPassword({
      email: val('companyEmail'),
      password: val('companyPass')
    });

    if(result.error) throw result.error;

    const profile = await getProfile(result.data.user);
    if(!profile || profile.role !== 'company') throw new Error('企業プロフィールが見つかりません');
    if(profile.status !== 'approved' && profile.status !== 'active') throw new Error('管理者承認待ちです');

    currentProfile = profile;
    document.getElementById('companyInfo').textContent = profile.email + ' / ' + profile.status;
    showSection('companyDash');
    companyHome();
  }catch(error){
    msg('companyMsg', 'ログインエラー：' + error.message, 'err');
  }
}

async function adminLogin(){
  try{
    msg('adminMsg', 'ログイン中...', 'info');
    const result = await sb.auth.signInWithPassword({
      email: val('adminEmail'),
      password: val('adminPass')
    });

    if(result.error) throw result.error;

    let profile = await getProfile(result.data.user);

    if(!profile && result.data.user.email === 'admin@sola-career.com'){
      const created = await sb.from('user_profiles').insert({
        auth_user_id: result.data.user.id,
        email: result.data.user.email,
        role: 'admin',
        name: '管理者',
        status: 'active'
      }).select('*').single();

      if(created.error) throw created.error;
      profile = created.data;
    }

    if(!profile || profile.role !== 'admin') throw new Error('管理者プロフィールが見つかりません');

    currentProfile = profile;
    document.getElementById('adminInfo').textContent = profile.email + ' / ' + profile.status;
    showSection('adminDash');
    adminStats();
  }catch(error){
    msg('adminMsg', 'ログインエラー：' + error.message, 'err');
  }
}

function studentHome(){
  document.getElementById('studentContent').innerHTML = '<div class="alert ok">学生ログイン成功</div><p>求人を確認して応募できます。</p>';
}

async function loadStudentJobs(kind){
  const table = kind === 'dispatch' ? 'dispatch_jobs' : 'career_jobs';
  const result = await sb.from(table).select('*').eq('active', true).order('created_at', {ascending:false});

  if(result.error){
    document.getElementById('studentContent').innerHTML = '読込エラー：' + escapeHtml(result.error.message);
    return;
  }

  let html = '';
  (result.data || []).forEach(job => {
    html += '<div class="job">' +
      '<span class="badge">' + (kind === 'dispatch' ? '派遣' : '就職') + '</span>' +
      '<h3>' + escapeHtml(job.company) + '</h3>' +
      '<p>' + escapeHtml(job.job_type) + '</p>' +
      '<p>' + escapeHtml(job.work_place) + '</p>' +
      '<p>' + escapeHtml(job.pay) + '</p>' +
      '<button class="apply-btn" data-kind="' + kind + '" data-id="' + job.id + '">応募する</button>' +
      '</div>';
  });

  document.getElementById('studentContent').innerHTML = html || '求人はありません';

  document.querySelectorAll('.apply-btn').forEach(button => {
    button.addEventListener('click', () => applyJob(button.dataset.kind, button.dataset.id));
  });
}

async function applyJob(kind, jobId){
  if(!currentProfile || currentProfile.role !== 'student'){
    alert('学生ログインが必要です');
    return;
  }

  if(!currentProfile.student_id){
    alert('学生IDが未連携です。user_profiles の student_id を確認してください。');
    return;
  }

  const table = kind === 'dispatch' ? 'dispatch_apps' : 'career_apps';
  const result = await sb.from(table).insert({
    job_id: jobId,
    student_id: currentProfile.student_id,
    status: '応募中'
  });

  if(result.error){
    alert('応募エラー：' + result.error.message);
    return;
  }

  alert('応募しました');
}

async function studentApplications(){
  let rows = '';

  const dispatchResult = await sb.from('dispatch_apps')
    .select('*,dispatch_jobs(company,job_type)')
    .eq('student_id', currentProfile.student_id)
    .order('created_at', {ascending:false});

  const careerResult = await sb.from('career_apps')
    .select('*,career_jobs(company,job_type)')
    .eq('student_id', currentProfile.student_id)
    .order('created_at', {ascending:false});

  (dispatchResult.data || []).forEach(app => {
    rows += '<tr><td>派遣</td><td>' + escapeHtml(app.dispatch_jobs?.company) + '</td><td>' + escapeHtml(app.dispatch_jobs?.job_type) + '</td><td>' + escapeHtml(app.status) + '</td></tr>';
  });

  (careerResult.data || []).forEach(app => {
    rows += '<tr><td>就職</td><td>' + escapeHtml(app.career_jobs?.company) + '</td><td>' + escapeHtml(app.career_jobs?.job_type) + '</td><td>' + escapeHtml(app.status) + '</td></tr>';
  });

  document.getElementById('studentContent').innerHTML =
    '<h3>応募履歴</h3><table><tr><th>区分</th><th>企業</th><th>職種</th><th>状態</th></tr>' + rows + '</table>';
}

function companyHome(){
  document.getElementById('companyContent').innerHTML = '<div class="alert ok">企業ログイン成功</div><p>求人投稿・応募者確認ができます。</p>';
}

async function companyJobs(){
  let html = '<h3>自社求人</h3>';

  const dispatchResult = await sb.from('dispatch_jobs').select('*').eq('company_id', currentProfile.company_id).order('created_at', {ascending:false});
  const careerResult = await sb.from('career_jobs').select('*').eq('company_id', currentProfile.company_id).order('created_at', {ascending:false});

  (dispatchResult.data || []).forEach(job => {
    html += '<div class="job"><span class="badge">派遣</span><h3>' + escapeHtml(job.job_type) + '</h3><p>' + escapeHtml(job.work_place) + ' / ' + escapeHtml(job.pay) + '</p></div>';
  });

  (careerResult.data || []).forEach(job => {
    html += '<div class="job"><span class="badge">就職</span><h3>' + escapeHtml(job.job_type) + '</h3><p>' + escapeHtml(job.work_place) + ' / ' + escapeHtml(job.pay) + '</p></div>';
  });

  document.getElementById('companyContent').innerHTML = html;
}

function companyAddJobForm(){
  document.getElementById('companyContent').innerHTML =
    '<h3>求人投稿</h3>' +
    '<div class="row"><div><label>求人区分</label><select id="newJobKind"><option value="dispatch">人材派遣</option><option value="career">就職支援</option></select></div><div><label>職種</label><input id="newJobType"></div></div>' +
    '<label>仕事内容</label><textarea id="newJobWork"></textarea>' +
    '<div class="row"><div><label>勤務地</label><input id="newJobPlace"></div><div><label>勤務日・勤務時間 / 雇用形態</label><input id="newJobTime"></div></div>' +
    '<div class="row"><div><label>給与</label><input id="newJobPay"></div><div><label>募集人数</label><input id="newJobQuota" type="number" value="1"></div></div>' +
    '<label>詳細説明</label><textarea id="newJobDetail"></textarea>' +
    '<button id="companySubmitJobBtn">求人を投稿</button>';

  document.getElementById('companySubmitJobBtn').addEventListener('click', companySubmitJob);
}

async function companySubmitJob(){
  try{
    const companyResult = await sb.from('companies').select('*').eq('id', currentProfile.company_id).maybeSingle();
    if(companyResult.error) throw companyResult.error;

    const company = companyResult.data;
    if(!company){
      alert('企業情報が見つかりません');
      return;
    }

    const kind = val('newJobKind');
    const payload = {
      company: company.company_name,
      company_id: currentProfile.company_id,
      job_type: val('newJobType'),
      work_content: val('newJobWork'),
      work_place: val('newJobPlace'),
      pay: val('newJobPay'),
      detail_description: val('newJobDetail'),
      active: true,
      pinned: false
    };

    let result;
    if(kind === 'dispatch'){
      payload.work_time = val('newJobTime');
      payload.quota = Number(val('newJobQuota') || 1);
      result = await sb.from('dispatch_jobs').insert(payload);
    }else{
      payload.employment_type = val('newJobTime');
      result = await sb.from('career_jobs').insert(payload);
    }

    if(result.error) throw result.error;

    alert('求人を投稿しました');
    companyJobs();
  }catch(error){
    alert('投稿エラー：' + error.message);
  }
}

async function companyApplicants(){
  const dispatchJobs = await sb.from('dispatch_jobs').select('id').eq('company_id', currentProfile.company_id);
  const careerJobs = await sb.from('career_jobs').select('id').eq('company_id', currentProfile.company_id);

  const dispatchIds = (dispatchJobs.data || []).map(job => job.id);
  const careerIds = (careerJobs.data || []).map(job => job.id);

  let rows = '';

  if(dispatchIds.length){
    const result = await sb.from('dispatch_apps')
      .select('*,students(name,email,tel,resume_url),dispatch_jobs(job_type)')
      .in('job_id', dispatchIds)
      .order('created_at', {ascending:false});

    (result.data || []).forEach(app => {
      rows += '<tr><td>派遣</td><td>' + escapeHtml(app.dispatch_jobs?.job_type) + '</td><td>' + escapeHtml(app.students?.name) + '<br>' + escapeHtml(app.students?.email) + '<br>' + escapeHtml(app.students?.tel) + '</td><td>' + escapeHtml(app.status) + '</td><td><button class="status-btn" data-table="dispatch_apps" data-id="' + app.id + '" data-status="面接予定">面接予定</button><button class="status-btn" data-table="dispatch_apps" data-id="' + app.id + '" data-status="採用">採用</button></td></tr>';
    });
  }

  if(careerIds.length){
    const result = await sb.from('career_apps')
      .select('*,students(name,email,tel,resume_url),career_jobs(job_type)')
      .in('job_id', careerIds)
      .order('created_at', {ascending:false});

    (result.data || []).forEach(app => {
      rows += '<tr><td>就職</td><td>' + escapeHtml(app.career_jobs?.job_type) + '</td><td>' + escapeHtml(app.students?.name) + '<br>' + escapeHtml(app.students?.email) + '<br>' + escapeHtml(app.students?.tel) + '</td><td>' + escapeHtml(app.status) + '</td><td><button class="status-btn" data-table="career_apps" data-id="' + app.id + '" data-status="面接予定">面接予定</button><button class="status-btn" data-table="career_apps" data-id="' + app.id + '" data-status="内定">内定</button></td></tr>';
    });
  }

  document.getElementById('companyContent').innerHTML =
    '<h3>応募学生</h3>' +
    (rows ? '<table><tr><th>区分</th><th>職種</th><th>学生</th><th>状態</th><th>操作</th></tr>' + rows + '</table>' : '応募学生はまだありません。');

  document.querySelectorAll('.status-btn').forEach(button => {
    button.addEventListener('click', () => updateAppStatus(button.dataset.table, button.dataset.id, button.dataset.status));
  });
}

async function updateAppStatus(table, id, status){
  const result = await sb.from(table).update({status: status}).eq('id', id);

  if(result.error){
    alert('更新エラー：' + result.error.message);
    return;
  }

  alert('状態を更新しました');

  if(currentProfile.role === 'company') companyApplicants();
  if(currentProfile.role === 'admin') adminApplications();
}

async function adminStats(){
  const studentCount = await sb.from('students').select('id', {count:'exact', head:true});
  const companyCount = await sb.from('companies').select('id', {count:'exact', head:true});
  const dispatchCount = await sb.from('dispatch_jobs').select('id', {count:'exact', head:true});
  const careerCount = await sb.from('career_jobs').select('id', {count:'exact', head:true});

  document.getElementById('adminContent').innerHTML =
    '<div class="stat-grid">' +
    '<div class="stat-box">学生数<br><b>' + numberOrZero(studentCount.count) + '</b></div>' +
    '<div class="stat-box">企業数<br><b>' + numberOrZero(companyCount.count) + '</b></div>' +
    '<div class="stat-box">派遣求人<br><b>' + numberOrZero(dispatchCount.count) + '</b></div>' +
    '<div class="stat-box">就職求人<br><b>' + numberOrZero(careerCount.count) + '</b></div>' +
    '</div>';
}

async function adminCompanies(){
  const result = await sb.from('user_profiles').select('*').eq('role', 'company').order('created_at', {ascending:false});

  let rows = '';
  (result.data || []).forEach(company => {
    rows += '<tr><td>' + escapeHtml(company.email) + '</td><td>' + escapeHtml(company.name) + '</td><td>' + escapeHtml(company.status) + '</td><td><button class="approve-btn" data-profile="' + company.id + '" data-company="' + company.company_id + '">承認</button></td></tr>';
  });

  document.getElementById('adminContent').innerHTML =
    '<h3>企業承認</h3><table><tr><th>メール</th><th>会社名</th><th>状態</th><th>操作</th></tr>' + rows + '</table>';

  document.querySelectorAll('.approve-btn').forEach(button => {
    button.addEventListener('click', () => approveCompany(button.dataset.profile, button.dataset.company));
  });
}

async function approveCompany(profileId, companyId){
  await sb.from('user_profiles').update({status:'approved'}).eq('id', profileId);

  if(companyId && companyId !== 'null'){
    await sb.from('companies').update({status:'approved'}).eq('id', companyId);
  }

  alert('承認しました');
  adminCompanies();
}

async function adminStudents(){
  const result = await sb.from('user_profiles').select('*').eq('role', 'student').order('created_at', {ascending:false});

  let rows = '';
  (result.data || []).forEach(student => {
    rows += '<tr><td>' + escapeHtml(student.email) + '</td><td>' + escapeHtml(student.name) + '</td><td>' + escapeHtml(student.status) + '</td></tr>';
  });

  document.getElementById('adminContent').innerHTML =
    '<h3>学生管理</h3><table><tr><th>メール</th><th>氏名</th><th>状態</th></tr>' + rows + '</table>';
}

async function adminApplications(){
  const dispatchResult = await sb.from('dispatch_apps').select('*,students(name,email),dispatch_jobs(company,job_type)').order('created_at', {ascending:false});
  const careerResult = await sb.from('career_apps').select('*,students(name,email),career_jobs(company,job_type)').order('created_at', {ascending:false});

  let rows = '';

  (dispatchResult.data || []).forEach(app => {
    rows += '<tr><td>派遣</td><td>' + escapeHtml(app.dispatch_jobs?.company) + '</td><td>' + escapeHtml(app.dispatch_jobs?.job_type) + '</td><td>' + escapeHtml(app.students?.name) + '<br>' + escapeHtml(app.students?.email) + '</td><td>' + escapeHtml(app.status) + '</td></tr>';
  });

  (careerResult.data || []).forEach(app => {
    rows += '<tr><td>就職</td><td>' + escapeHtml(app.career_jobs?.company) + '</td><td>' + escapeHtml(app.career_jobs?.job_type) + '</td><td>' + escapeHtml(app.students?.name) + '<br>' + escapeHtml(app.students?.email) + '</td><td>' + escapeHtml(app.status) + '</td></tr>';
  });

  document.getElementById('adminContent').innerHTML =
    '<h3>応募管理</h3><table><tr><th>区分</th><th>企業</th><th>職種</th><th>学生</th><th>状態</th></tr>' + rows + '</table>';
}

async function adminJobs(){
  const dispatchResult = await sb.from('dispatch_jobs').select('*').order('created_at', {ascending:false});
  const careerResult = await sb.from('career_jobs').select('*').order('created_at', {ascending:false});

  let rows = '';

  (dispatchResult.data || []).forEach(job => {
    rows += '<tr><td>派遣</td><td>' + escapeHtml(job.company) + '</td><td>' + escapeHtml(job.job_type) + '</td><td>' + escapeHtml(job.work_place) + '</td><td>' + escapeHtml(job.pay) + '</td><td>' + (job.active ? '掲載中' : '停止') + '</td></tr>';
  });

  (careerResult.data || []).forEach(job => {
    rows += '<tr><td>就職</td><td>' + escapeHtml(job.company) + '</td><td>' + escapeHtml(job.job_type) + '</td><td>' + escapeHtml(job.work_place) + '</td><td>' + escapeHtml(job.pay) + '</td><td>' + (job.active ? '掲載中' : '停止') + '</td></tr>';
  });

  document.getElementById('adminContent').innerHTML =
    '<h3>求人管理</h3><table><tr><th>区分</th><th>企業</th><th>職種</th><th>勤務地</th><th>給与</th><th>状態</th></tr>' + rows + '</table>';
}

async function showDispatchPublic(){
  showSection('publicDispatch');
  await loadPublicJobs('dispatch');
}

async function showCareerPublic(){
  showSection('publicCareer');
  await loadPublicJobs('career');
}

async function loadPublicJobs(kind){
  const table = kind === 'dispatch' ? 'dispatch_jobs' : 'career_jobs';
  const box = document.getElementById(kind === 'dispatch' ? 'publicDispatchList' : 'publicCareerList');
  const result = await sb.from(table).select('*').eq('active', true).order('created_at', {ascending:false});

  let html = '';
  (result.data || []).forEach(job => {
    html += '<div class="job">' +
      '<span class="badge">' + (kind === 'dispatch' ? '派遣' : '就職') + '</span>' +
      '<h3>' + escapeHtml(job.company) + '</h3>' +
      '<p>' + escapeHtml(job.job_type) + '</p>' +
      '<p>' + escapeHtml(job.work_place) + '</p>' +
      '<p>' + escapeHtml(job.pay) + '</p>' +
      '</div>';
  });

  box.innerHTML = html || '求人はありません';
}

async function logout(){
  await sb.auth.signOut();
  currentProfile = null;
  showSection('home');
}

document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('[data-nav]').forEach(button => {
    button.addEventListener('click', () => showSection(button.dataset.nav));
  });

  document.getElementById('navDispatch').addEventListener('click', showDispatchPublic);
  document.getElementById('navCareer').addEventListener('click', showCareerPublic);
  document.getElementById('homeDispatch').addEventListener('click', showDispatchPublic);
  document.getElementById('homeCareer').addEventListener('click', showCareerPublic);
  document.getElementById('logoutBtn').addEventListener('click', logout);

  document.getElementById('studentSignupBtn').addEventListener('click', studentSignup);
  document.getElementById('studentLoginBtn').addEventListener('click', studentLogin);
  document.getElementById('companySignupBtn').addEventListener('click', companySignup);
  document.getElementById('companyLoginBtn').addEventListener('click', companyLogin);
  document.getElementById('adminLoginBtn').addEventListener('click', adminLogin);

  document.getElementById('studentHomeBtn').addEventListener('click', studentHome);
  document.getElementById('studentDispatchBtn').addEventListener('click', () => loadStudentJobs('dispatch'));
  document.getElementById('studentCareerBtn').addEventListener('click', () => loadStudentJobs('career'));
  document.getElementById('studentAppsBtn').addEventListener('click', studentApplications);

  document.getElementById('companyHomeBtn').addEventListener('click', companyHome);
  document.getElementById('companyJobsBtn').addEventListener('click', companyJobs);
  document.getElementById('companyAddJobBtn').addEventListener('click', companyAddJobForm);
  document.getElementById('companyApplicantsBtn').addEventListener('click', companyApplicants);

  document.getElementById('adminStatsBtn').addEventListener('click', adminStats);
  document.getElementById('adminCompaniesBtn').addEventListener('click', adminCompanies);
  document.getElementById('adminStudentsBtn').addEventListener('click', adminStudents);
  document.getElementById('adminApplicationsBtn').addEventListener('click', adminApplications);
  document.getElementById('adminJobsBtn').addEventListener('click', adminJobs);
});
</script>
