<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLA CAREER｜Auth正式テスト版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#fffdf7;color:#111827}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900;margin-right:auto}.logo span{color:#32c904}
button{border:0;border-radius:10px;background:#32c904;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}
button.secondary{background:#e0f2fe;color:#0369a1}button.gray{background:#f1f5f9;color:#334155}button.red{background:#dc2626}
main{max-width:1100px;margin:24px auto;padding:0 14px}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(15,23,42,.06)}
.hero{background:linear-gradient(135deg,#ecffe4,#eef7ff);padding:50px 24px;border-radius:28px}
.hero h1{font-size:46px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.entry{padding:28px;border-radius:22px;color:#fff;cursor:pointer}
.dispatch{background:linear-gradient(135deg,#34d399,#0ea5e9)}
.career{background:linear-gradient(135deg,#2563eb,#7c3aed)}
input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 14px;box-sizing:border-box;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alert{padding:12px;border-radius:10px;margin:10px 0}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}
.job{border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0;background:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#f1f5f9;color:#334155}
.badge{display:inline-block;border-radius:999px;background:#e0f2fe;color:#0369a1;padding:4px 10px;font-size:12px;font-weight:800;margin-right:4px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e5e7eb;padding:10px;text-align:left;font-size:14px;vertical-align:top}th{background:#f8fafc}
@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.hero h1{font-size:34px}}

.status-pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:#fef3c7;color:#92400e}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat-box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.stat-box b{font-size:30px;color:#32c904}
</style>
</head>
<body>

<header>
<div class="logo">SOLA <span>CAREER</span></div>
<button class="secondary" onclick="show('home')">ホーム</button>
<button class="secondary" onclick="show('student')">学生</button>
<button class="secondary" onclick="show('company')">企業</button>
<button class="secondary" onclick="show('admin')">管理者</button>
<button class="secondary" onclick="show('dispatch')">人材派遣</button>
<button class="secondary" onclick="show('career')">就職支援</button>
<button class="gray" onclick="logout()">ログアウト</button>
</header>

<main>

<section id="home" class="section active">
<div class="hero">
<h1>SOLA CAREER</h1>
<p>人材派遣・就職支援プラットフォーム</p>
<p>Supabase Auth 対応テスト版</p>
</div>

<div class="grid" style="margin-top:20px">
<div class="entry dispatch" onclick="show('dispatch')"><h2>人材派遣</h2><p>短期・単発・時間指定の求人</p></div>
<div class="entry career" onclick="show('career')"><h2>就職支援</h2><p>正社員・特定技能・長期雇用</p></div>
</div>
</section>

<section id="student" class="section">
<div class="card">
<h2>学生ログイン / 新規登録</h2>
<div id="studentMsg"></div>
<div class="row">
<div><label>メール</label><input id="studentEmail" type="email"></div>
<div><label>パスワード</label><input id="studentPass" type="password"></div>
</div>
<div class="row">
<div><label>氏名</label><input id="studentName"></div>
<div><label>電話番号</label><input id="studentTel"></div>
</div>
<button onclick="studentSignup()">学生新規登録</button>
<button class="secondary" onclick="studentLogin()">学生ログイン</button>
</div>
</section>

<section id="company" class="section">
<div class="card">
<h2>企業ログイン / 新規登録</h2>
<div id="companyMsg"></div>
<div class="row">
<div><label>メール</label><input id="companyEmail" type="email"></div>
<div><label>パスワード</label><input id="companyPass" type="password"></div>
</div>
<div class="row">
<div><label>会社名</label><input id="companyName"></div>
<div><label>電話番号</label><input id="companyTel"></div>
</div>
<label>担当者名</label><input id="companyPerson">
<button onclick="companySignup()">企業登録申請</button>
<button class="secondary" onclick="companyLogin()">企業ログイン</button>
</div>
</section>

<section id="admin" class="section">
<div class="card">
<h2>管理者ログイン</h2>
<div id="adminMsg"></div>
<label>メール</label><input id="adminEmail" type="email" placeholder="admin@sola-career.com">
<label>パスワード</label><input id="adminPass" type="password">
<button onclick="adminLogin()">管理者ログイン</button>
</div>
</section>

<section id="dispatch" class="section"><div class="card"><h2>人材派遣求人</h2><div id="dispatchList"></div></div></section>
<section id="career" class="section"><div class="card"><h2>就職求人</h2><div id="careerList"></div></div></section>

<section id="dashboard" class="section">
<div class="card">
<h2 id="dashTitle">マイページ</h2>
<p id="dashInfo"></p>
<div id="dashTabs" class="tabs"></div>
<div id="dashContent"></div>
</div>
</section>

</main>

<script>
const SUPABASE_URL='https://yhwdmlvzzrnvnnxapsfr.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_8ZhlfQc5zqU6xNEFduzymA__aBsJyzf';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentProfile=null;

function show(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(id==='dispatch') loadJobs('dispatch',false);
 if(id==='career') loadJobs('career',false);
}

function val(id){return document.getElementById(id).value.trim();}
function msg(id,text,type='ok'){document.getElementById(id).innerHTML='<div class="alert '+type+'">'+text+'</div>';}

async function getProfile(user){
 const r=await sb.from('user_profiles').select('*').eq('auth_user_id',user.id).maybeSingle();
 if(r.error) throw r.error;
 return r.data;
}

async function createProfile(user,role,extra){
 const payload={auth_user_id:user.id,email:user.email,role:role,name:extra.name||'',tel:extra.tel||'',status:role==='company'?'pending':'active'};
 const pr=await sb.from('user_profiles').insert(payload).select('*').single();
 if(pr.error) throw pr.error;

 if(role==='student'){
  const sr=await sb.from('students').insert({auth_user_id:user.id,email:user.email,name:extra.name,tel:extra.tel,school:'SOLA学園'}).select('*').single();
  if(!sr.error) await sb.from('user_profiles').update({student_id:sr.data.id}).eq('id',pr.data.id);
 }

 if(role==='company'){
  const cr=await sb.from('companies').insert({auth_user_id:user.id,email:user.email,company_name:extra.company_name,tel:extra.tel,contact_person:extra.contact_person,status:'pending'}).select('*').single();
  if(!cr.error) await sb.from('user_profiles').update({company_id:cr.data.id}).eq('id',pr.data.id);
 }

 return pr.data;
}

async function studentSignup(){
 try{
  msg('studentMsg','登録中...','info');
  const r=await sb.auth.signUp({email:val('studentEmail'),password:val('studentPass')});
  if(r.error) throw r.error;
  await createProfile(r.data.user,'student',{name:val('studentName'),tel:val('studentTel')});
  msg('studentMsg','学生登録成功','ok');
 }catch(e){msg('studentMsg','登録エラー：'+e.message,'err');}
}

async function studentLogin(){
 try{
  msg('studentMsg','ログイン中...','info');
  const r=await sb.auth.signInWithPassword({email:val('studentEmail'),password:val('studentPass')});
  if(r.error) throw r.error;
  const p=await getProfile(r.data.user);
  if(!p || p.role!=='student') throw new Error('学生プロフィールが見つかりません');
  openDashboard(p);
 }catch(e){msg('studentMsg','ログインエラー：'+e.message,'err');}
}

async function companySignup(){
 try{
  msg('companyMsg','登録中...','info');
  const r=await sb.auth.signUp({email:val('companyEmail'),password:val('companyPass')});
  if(r.error) throw r.error;
  await createProfile(r.data.user,'company',{company_name:val('companyName'),name:val('companyName'),tel:val('companyTel'),contact_person:val('companyPerson')});
  msg('companyMsg','企業登録申請完了。管理者承認後にログインできます。','ok');
 }catch(e){msg('companyMsg','登録エラー：'+e.message,'err');}
}

async function companyLogin(){
 try{
  msg('companyMsg','ログイン中...','info');
  const r=await sb.auth.signInWithPassword({email:val('companyEmail'),password:val('companyPass')});
  if(r.error) throw r.error;
  const p=await getProfile(r.data.user);
  if(!p || p.role!=='company') throw new Error('企業プロフィールが見つかりません');
  if(p.status!=='approved' && p.status!=='active') throw new Error('管理者承認待ちです');
  openDashboard(p);
 }catch(e){msg('companyMsg','ログインエラー：'+e.message,'err');}
}

async function adminLogin(){
 try{
  msg('adminMsg','ログイン中...','info');
  const r=await sb.auth.signInWithPassword({email:val('adminEmail'),password:val('adminPass')});
  if(r.error) throw r.error;
  let p=await getProfile(r.data.user);

  if(!p && r.data.user.email==='admin@sola-career.com'){
   const cr=await sb.from('user_profiles').insert({auth_user_id:r.data.user.id,email:r.data.user.email,role:'admin',name:'管理者',status:'active'}).select('*').single();
   if(cr.error) throw cr.error;
   p=cr.data;
  }

  if(!p || p.role!=='admin') throw new Error('管理者プロフィールが見つかりません');
  openDashboard(p);
 }catch(e){msg('adminMsg','ログインエラー：'+e.message,'err');}
}

function openDashboard(profile){
 currentProfile=profile;
 document.getElementById('dashTitle').textContent=profile.role==='admin'?'管理者ダッシュボード':profile.role==='company'?'企業マイページ':'学生マイページ';
 document.getElementById('dashInfo').textContent=profile.email+' / '+profile.role+' / '+profile.status;

 if(profile.role==='student') renderStudentDashboard();
 if(profile.role==='company') renderCompanyDashboard();
 if(profile.role==='admin') renderAdminDashboard();

 show('dashboard');
}


function renderStudentDashboard(){
 document.getElementById('dashTabs').innerHTML =
  '<button type="button" onclick="studentHome()">学生情報</button>' +
  '<button type="button" onclick="loadJobsForStudent(\\'dispatch\\')">派遣求人</button>' +
  '<button type="button" onclick="loadJobsForStudent(\\'career\\')">就職求人</button>' +
  '<button type="button" onclick="studentApps()">応募履歴</button>';
 studentHome();
}

function studentHome(){
 document.getElementById('dashContent').innerHTML =
 '<div class="alert ok">学生ログイン成功</div><p>求人を確認して応募できます。</p>';
}

function renderCompanyDashboard(){
 document.getElementById('dashTabs').innerHTML =
  '<button type="button" onclick="companyHome()">企業情報</button>' +
  '<button type="button" onclick="companyJobs()">自社求人</button>' +
  '<button type="button" onclick="companyAddJobForm()">求人投稿</button>' +
  '<button type="button" onclick="companyApplicants()">応募学生</button>';
 companyHome();
}

function companyHome(){
 document.getElementById('dashContent').innerHTML =
 '<div class="alert ok">企業ログイン成功</div><p>求人投稿・応募者確認ができます。</p>';
}

function renderAdminDashboard(){
 document.getElementById('dashTabs').innerHTML =
  '<button type="button" onclick="adminHome()">統計</button>' +
  '<button type="button" onclick="adminCompanies()">企業承認</button>' +
  '<button type="button" onclick="adminStudents()">学生管理</button>' +
  '<button type="button" onclick="adminApplications()">応募管理</button>' +
  '<button type="button" onclick="adminJobs()">求人管理</button>';
 adminHome();
}


async function loadJobsForStudent(kind){
 return loadJobs(kind,true);
}

function companyAddJobForm(){
 document.getElementById('dashContent').innerHTML =
 '<h3>求人投稿</h3>' +
 '<div class="row"><div><label>求人区分</label><select id="newJobKind"><option value="dispatch">人材派遣</option><option value="career">就職支援</option></select></div><div><label>職種</label><input id="newJobType"></div></div>' +
 '<label>仕事内容</label><textarea id="newJobWork"></textarea>' +
 '<div class="row"><div><label>勤務地</label><input id="newJobPlace"></div><div><label>勤務日・勤務時間 / 雇用形態</label><input id="newJobTime"></div></div>' +
 '<div class="row"><div><label>給与</label><input id="newJobPay"></div><div><label>募集人数</label><input id="newJobQuota" type="number" value="1"></div></div>' +
 '<label>詳細説明</label><textarea id="newJobDetail"></textarea>' +
 '<button type="button" onclick="companySubmitJob()">求人を投稿</button>';
}

async function companySubmitJob(){
 try{
  if(!currentProfile || currentProfile.role!=='company'){alert('企業ログインが必要です');return;}
  const cr=await sb.from('companies').select('*').eq('id',currentProfile.company_id).maybeSingle();
  if(cr.error) throw cr.error;
  const company=cr.data;
  if(!company){alert('企業情報が見つかりません');return;}

  const kind=val('newJobKind');
  const payload={
   company:company.company_name,
   company_id:currentProfile.company_id,
   job_type:val('newJobType'),
   work_content:val('newJobWork'),
   work_place:val('newJobPlace'),
   pay:val('newJobPay'),
   detail_description:val('newJobDetail'),
   active:true,
   pinned:false
  };

  let r;
  if(kind==='dispatch'){
   payload.work_time=val('newJobTime');
   payload.quota=Number(val('newJobQuota')||1);
   r=await sb.from('dispatch_jobs').insert(payload);
  }else{
   payload.employment_type=val('newJobTime');
   r=await sb.from('career_jobs').insert(payload);
  }

  if(r.error) throw r.error;
  alert('求人を投稿しました');
  companyJobs();
 }catch(e){
  alert('投稿エラー：'+e.message);
 }
}

async function companyApplicants(){
 if(!currentProfile || currentProfile.role!=='company') return;

 const dJobs=await sb.from('dispatch_jobs').select('id').eq('company_id',currentProfile.company_id);
 const cJobs=await sb.from('career_jobs').select('id').eq('company_id',currentProfile.company_id);

 const dIds=(dJobs.data||[]).map(j=>j.id);
 const cIds=(cJobs.data||[]).map(j=>j.id);

 let rows='';

 if(dIds.length){
  const d=await sb.from('dispatch_apps')
   .select('*,students(name,email,tel,resume_url),dispatch_jobs(company,job_type)')
   .in('job_id',dIds)
   .order('created_at',{ascending:false});

  (d.data||[]).forEach(a=>{
   rows += '<tr><td>派遣</td><td>'+new Date(a.created_at).toLocaleString()+'</td><td>'+(a.dispatch_jobs?.job_type||'')+'</td><td>'+(a.students?.name||'')+'<br>'+(a.students?.email||'')+'<br>'+(a.students?.tel||'')+'</td><td>'+(a.students?.resume_url?'<a href="'+a.students.resume_url+'" target="_blank">履歴書</a>':'未提出')+'</td><td><span class="status-pill">'+a.status+'</span></td><td><button type="button" onclick="updateAppStatus(\\'dispatch_apps\\',\\''+a.id+'\\',\\'面接予定\\')">面接予定</button><button type="button" onclick="updateAppStatus(\\'dispatch_apps\\',\\''+a.id+'\\',\\'採用\\')">採用</button></td></tr>';
  });
 }

 if(cIds.length){
  const c=await sb.from('career_apps')
   .select('*,students(name,email,tel,resume_url),career_jobs(company,job_type)')
   .in('job_id',cIds)
   .order('created_at',{ascending:false});

  (c.data||[]).forEach(a=>{
   rows += '<tr><td>就職</td><td>'+new Date(a.created_at).toLocaleString()+'</td><td>'+(a.career_jobs?.job_type||'')+'</td><td>'+(a.students?.name||'')+'<br>'+(a.students?.email||'')+'<br>'+(a.students?.tel||'')+'</td><td>'+(a.students?.resume_url?'<a href="'+a.students.resume_url+'" target="_blank">履歴書</a>':'未提出')+'</td><td><span class="status-pill">'+a.status+'</span></td><td><button type="button" onclick="updateAppStatus(\\'career_apps\\',\\''+a.id+'\\',\\'面接予定\\')">面接予定</button><button type="button" onclick="updateAppStatus(\\'career_apps\\',\\''+a.id+'\\',\\'内定\\')">内定</button></td></tr>';
  });
 }

 document.getElementById('dashContent').innerHTML =
 '<h3>応募学生</h3>' +
 (rows ? '<table><tr><th>区分</th><th>応募日時</th><th>職種</th><th>学生</th><th>履歴書</th><th>状態</th><th>操作</th></tr>'+rows+'</table>' : '応募学生はまだありません。');
}

async function updateAppStatus(table,id,status){
 const r=await sb.from(table).update({status:status}).eq('id',id);
 if(r.error){alert('更新エラー：'+r.error.message);return;}
 alert('状態を更新しました');
 if(currentProfile.role==='company') companyApplicants();
 if(currentProfile.role==='admin') adminApplications();
}

async function adminApplications(){
 const d=await sb.from('dispatch_apps').select('*,students(name,email,tel,resume_url),dispatch_jobs(company,job_type)').order('created_at',{ascending:false});
 const c=await sb.from('career_apps').select('*,students(name,email,tel,resume_url),career_jobs(company,job_type)').order('created_at',{ascending:false});
 let rows='';
 (d.data||[]).forEach(a=>{
  rows+='<tr><td>派遣</td><td>'+new Date(a.created_at).toLocaleString()+'</td><td>'+(a.dispatch_jobs?.company||'')+'</td><td>'+(a.dispatch_jobs?.job_type||'')+'</td><td>'+(a.students?.name||'')+'<br>'+(a.students?.email||'')+'</td><td>'+a.status+'</td></tr>';
 });
 (c.data||[]).forEach(a=>{
  rows+='<tr><td>就職</td><td>'+new Date(a.created_at).toLocaleString()+'</td><td>'+(a.career_jobs?.company||'')+'</td><td>'+(a.career_jobs?.job_type||'')+'</td><td>'+(a.students?.name||'')+'<br>'+(a.students?.email||'')+'</td><td>'+a.status+'</td></tr>';
 });
 document.getElementById('dashContent').innerHTML='<h3>応募管理</h3>'+(rows?'<table><tr><th>区分</th><th>日時</th><th>企業</th><th>職種</th><th>学生</th><th>状態</th></tr>'+rows+'</table>':'応募はありません。');
}

async function adminJobs(){
 const d=await sb.from('dispatch_jobs').select('*').order('created_at',{ascending:false});
 const c=await sb.from('career_jobs').select('*').order('created_at',{ascending:false});
 let rows='';
 (d.data||[]).forEach(j=>{
  rows+='<tr><td>派遣</td><td>'+j.company+'</td><td>'+j.job_type+'</td><td>'+j.work_place+'</td><td>'+j.pay+'</td><td>'+(j.active?'掲載中':'停止')+'</td></tr>';
 });
 (c.data||[]).forEach(j=>{
  rows+='<tr><td>就職</td><td>'+j.company+'</td><td>'+j.job_type+'</td><td>'+j.work_place+'</td><td>'+j.pay+'</td><td>'+(j.active?'掲載中':'停止')+'</td></tr>';
 });
 document.getElementById('dashContent').innerHTML='<h3>求人管理</h3><table><tr><th>区分</th><th>企業</th><th>職種</th><th>勤務地</th><th>給与</th><th>状態</th></tr>'+rows+'</table>';
}

async function adminHome(){
 const s=await sb.from('students').select('id',{count:'exact',head:true});
 const c=await sb.from('companies').select('id',{count:'exact',head:true});
 const d=await sb.from('dispatch_jobs').select('id',{count:'exact',head:true});
 const j=await sb.from('career_jobs').select('id',{count:'exact',head:true});
 document.getElementById('dashContent').innerHTML='<h3>統計</h3><div class="grid"><div class="card">学生数<br><b>'+ (s.count||0) +'</b></div><div class="card">企業数<br><b>'+ (c.count||0) +'</b></div><div class="card">派遣求人<br><b>'+ (d.count||0) +'</b></div><div class="card">就職求人<br><b>'+ (j.count||0) +'</b></div></div>';
}

async function loadJobs(kind,inside){
 const table=kind==='dispatch'?'dispatch_jobs':'career_jobs';
 const box=inside?document.getElementById('dashContent'):document.getElementById(kind==='dispatch'?'dispatchList':'careerList');

 const r=await sb.from(table).select('*').eq('active',true).order('created_at',{ascending:false});

 if(r.error){box.innerHTML='読込エラー：'+r.error.message;return;}

 let html='';
 (r.data||[]).forEach(j=>{
  html+='<div class="job"><span class="badge">'+(kind==='dispatch'?'派遣':'就職')+'</span><h3>'+j.company+'</h3><p>'+(j.job_type||'')+'</p><p>'+(j.work_place||'')+'</p><p>'+(j.pay||'')+'</p>';
  if(inside && currentProfile && currentProfile.role==='student'){
   html+='<button onclick="applyJob(\''+kind+'\',\''+j.id+'\')">応募する</button>';
  }
  html+='</div>';
 });

 box.innerHTML=html||'求人はありません';
}

async function applyJob(kind,id){
 if(!currentProfile || currentProfile.role!=='student'){alert('学生ログインが必要です');return;}
 const table=kind==='dispatch'?'dispatch_apps':'career_apps';
 if(!currentProfile.student_id){alert('学生IDが未連携です。新しい学生アカウントで登録し直すか、user_profilesのstudent_idを確認してください。');return;} const r=await sb.from(table).insert({job_id:id,student_id:currentProfile.student_id,status:'応募中'});
 if(r.error){alert('応募エラー：'+r.error.message);return;}
 alert('応募しました');
}

async function studentApps(){
 const d=await sb.from('dispatch_apps').select('*,dispatch_jobs(company,job_type)').eq('student_id',currentProfile.student_id).order('created_at',{ascending:false});
 const c=await sb.from('career_apps').select('*,career_jobs(company,job_type)').eq('student_id',currentProfile.student_id).order('created_at',{ascending:false});
 let rows='';
 (d.data||[]).forEach(a=>rows+='<tr><td>派遣</td><td>'+a.dispatch_jobs?.company+'</td><td>'+a.status+'</td></tr>');
 (c.data||[]).forEach(a=>rows+='<tr><td>就職</td><td>'+a.career_jobs?.company+'</td><td>'+a.status+'</td></tr>');
 document.getElementById('dashContent').innerHTML='<h3>応募履歴</h3><table><tr><th>区分</th><th>企業</th><th>状態</th></tr>'+rows+'</table>';
}

async function companyJobs(){
 const d=await sb.from('dispatch_jobs').select('*').eq('company_id',currentProfile.company_id);
 const c=await sb.from('career_jobs').select('*').eq('company_id',currentProfile.company_id);
 let html='<h3>自社求人</h3>';
 (d.data||[]).forEach(j=>html+='<div class="job"><span class="badge">派遣</span><h3>'+j.company+'</h3><p>'+j.job_type+' / '+j.pay+'</p></div>');
 (c.data||[]).forEach(j=>html+='<div class="job"><span class="badge">就職</span><h3>'+j.company+'</h3><p>'+j.job_type+' / '+j.pay+'</p></div>');
 document.getElementById('dashContent').innerHTML=html;
}



async function adminCompanies(){
 const r=await sb.from('user_profiles').select('*').eq('role','company').order('created_at',{ascending:false});
 let rows='';
 (r.data||[]).forEach(c=>rows+='<tr><td>'+c.email+'</td><td>'+c.name+'</td><td>'+c.status+'</td><td><button onclick="approveCompany(\''+c.id+'\',\''+c.company_id+'\')">承認</button></td></tr>');
 document.getElementById('dashContent').innerHTML='<h3>企業承認</h3><table><tr><th>メール</th><th>会社名</th><th>状態</th><th>操作</th></tr>'+rows+'</table>';
}

async function approveCompany(profileId,companyId){
 await sb.from('user_profiles').update({status:'approved'}).eq('id',profileId);
 if(companyId && companyId!=='null') await sb.from('companies').update({status:'approved'}).eq('id',companyId);
 alert('承認しました');
 adminCompanies();
}

async function adminStudents(){
 const r=await sb.from('user_profiles').select('*').eq('role','student').order('created_at',{ascending:false});
 let rows='';
 (r.data||[]).forEach(s=>rows+='<tr><td>'+s.email+'</td><td>'+s.name+'</td><td>'+s.status+'</td></tr>');
 document.getElementById('dashContent').innerHTML='<h3>学生管理</h3><table><tr><th>メール</th><th>氏名</th><th>状態</th></tr>'+rows+'</table>';
}

async function logout(){
 await sb.auth.signOut();
 currentProfile=null;
 show('home');
}
